name: Build desktop apps

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            command: npm run build:windows
            artifact: windows
            files: dist/*.exe
          - os: macos-latest
            command: npm run build:macos
            artifact: macos
            files: |
              dist/*.dmg
              dist/*.zip
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        with:
          name: pomodoro-focus-${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
